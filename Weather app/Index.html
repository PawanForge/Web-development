<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Weather App</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

  <div class="container">

    <div class="search-box">
      <input type="text" class="cityInput" placeholder="Enter city name">

      <button class="searchBtn">

        <i class="fa-solid fa-magnifying-glass"></i>

      </button>

    </div>

    

    <div class="weather-body">

      <img src="https://cdn-icons-png.flaticon.com/512/11166/11166783.png" 

           alt="Weather Icon" 

           class="weather-img">

      <div class="weather-box">

        <span class="temp">0</span>

        <span class="deg">°C</span>

      </div>

      <p class="description">Light Rain</p>

      

      <div class="WD">

        <div class="humidity">

          <i class="fa-solid fa-droplet"></i>

          <span>78%</span>

          <p>Humidity</p>

        </div>

        <div class="speed">

          <i class="fa-solid fa-wind"></i>

          <span class="wind-speed">4.63Km/H</span>

          <p>Wind speed</p>

        </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>

            </html>
