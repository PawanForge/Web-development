<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-section">
    <div id="quiz">
      <h2 class="question" id="question">Quiz Question</h2>
      <hr/>

      <ul>
        <li>
          <input type="radio" name="answer" class="answer" id="a">
          <label for="a" id="option_1">Quiz Option 1</label>
        </li>
        <li>
          <input type="radio" name="answer" class="answer" id="b">
          <label for="b" id="option_2">Quiz Option 2</label>
        </li>
        <li>
          <input type="radio" name="answer" class="answer" id="c">
          <label for="c" id="option_3">Quiz Option 3</label>
        </li>
        <li>
          <input type="radio" name="answer" class="answer" id="d">
          <label for="d" id="option_4">Quiz Option 4</label>
        </li>
      </ul>

      <hr/>

      <div class="btn">
        <button type="submit" id="submit">Submit</button>
      </div>
    </div>
 
<div id="result" style="display: none;">
  <h2 id="result-text"></h2>
  <button id="playAgain">Play Again</button>
</div>

  </div>
  <script src="script.js"></script>
</body>
</html>
